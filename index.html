
<!DOCTYPE html>
<html lang="th">
<head> <link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14532d">
<title>คำนวณปริมาณน้ำโดรน BY MICKY</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#f1f5f2;font-family:Arial,sans-serif;color:#183322}
main{max-width:500px;margin:auto}
header{background:#14532d;color:white;padding:24px;border-radius:18px;text-align:center}
header h2{margin:0 0 8px}
.card{background:white;padding:18px;border-radius:16px;margin-top:16px}
label{display:block;font-weight:bold;margin:13px 0 6px}
input{width:100%;padding:14px;border:1px solid #ccd5ce;border-radius:10px;font-size:19px}
.result{background:#e9f5ec;padding:15px;border-radius:12px;margin-top:10px}
.value{font-size:26px;font-weight:bold;color:#14532d;margin-top:5px}
button{width:100%;padding:14px;border:0;border-radius:10px;margin-top:12px;font-size:17px;background:#14532d;color:white}
</style>
</head>
<body>
<main>
<header>
<h2>🚁 คำนวณปริมาณน้ำโดรน</h2>
<div>BY MICKY</div>
<small>DRONE WATER CALCULATOR</small>
</header>

<div class="card">
<h3>ข้อมูลการบิน</h3>
<label>ระยะทาง (เมตร)</label>
<input id="s" type="number" value="578" step="any">

<label>ความเร็ว (เมตร/วินาที)</label>
<input id="v" type="number" value="1.3" step="any">

<label>อัตราการไหล (ลิตร/นาที)</label>
<input id="f" type="number" value="30" step="any">

<label>น้ำที่เติมต่อเที่ยว (ลิตร)</label>
<input id="l" type="number" value="60" step="any">

<button onclick="calc()">คำนวณปริมาณน้ำ</button>
<button onclick="reset()" style="background:#64748b">เริ่มต้นใหม่</button>
</div>

<div class="card">
<h3>ผลการคำนวณ</h3>
<div class="result">เวลา (วินาที)<div class="value" id="sec">—</div></div>
<div class="result">เวลา (นาที)<div class="value" id="min">—</div></div>
<div class="result">ปริมาณน้ำทั้งหมด<div class="value" id="water">— ลิตร</div></div>
<div class="result">จำนวนเที่ยวบิน<div class="value" id="trip">— เที่ยว</div></div>
</div>
</main>

<script>
function calc(){
let s=Number(document.getElementById('s').value);
let v=Number(document.getElementById('v').value);
let f=Number(document.getElementById('f').value);
let l=Number(document.getElementById('l').value);
if(![s,v,f,l].every(Number.isFinite)||
['s','v','f','l'].some(id=>document.getElementById(id).value==='')||
s<=0||v<=0||f<0||l<=0){
alert('กรุณากรอกตัวเลขให้ถูกต้อง');
return;
}
let sec=s/v;
let min=sec/60;
let water=min*f;
let trip=Math.ceil(water/l);
document.getElementById('sec').innerText=sec.toFixed(2);
document.getElementById('min').innerText=min.toFixed(2);
document.getElementById('water').innerText=water.toFixed(2)+' ลิตร';
document.getElementById('trip').innerText=trip+' เที่ยว';
}
function reset(){
document.getElementById('s').value=578;
document.getElementById('v').value=1.3;
document.getElementById('f').value=30;
document.getElementById('l').value=60;
calc();
}
calc();
</script>
</body>
</html>
